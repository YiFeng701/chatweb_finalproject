<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>聊天協作系統</title>
    <style>
        /* --- 基礎設定 --- */
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; background-color: #f4f6f9; }

        /* --- 左側 Sidebar --- */
        #sidebar { width: 250px; background-color: #2c3e50; color: white; display: flex; flex-direction: column; padding: 20px; }
        #user-info { margin-bottom: 30px; border-bottom: 1px solid #34495e; padding-bottom: 20px; text-align: center; }
        #username-display { font-size: 1.2em; font-weight: bold; display: block; margin-bottom: 10px; }
        .nav-btn { background: none; border: none; color: #bdc3c7; padding: 15px; text-align: left; width: 100%; cursor: pointer; border-radius: 8px; font-size: 16px; margin-bottom: 5px; }
        .nav-btn:hover, .nav-btn.active { background-color: #1abc9c; color: white; }
        .btn-edit { background: #34495e; border: 1px solid #7f8c8d; color: #ccc; cursor: pointer; padding: 4px 8px; border-radius: 4px; }

        /* --- 右側內容 --- */
        #main-content { flex: 1; display: flex; flex-direction: column; background: white; position: relative;}
        .page-section { display: none; height: 100%; flex-direction: column; }
        .page-section.active { display: flex; }

        /* --- 聊天室 --- */
        #chat-list { flex: 1; padding: 20px; overflow-y: auto; background: #f9f9f9; list-style: none; margin: 0; }
        #chat-list li { margin-bottom: 8px; }
        #input-area { padding: 15px; border-top: 1px solid #ddd; display: flex; gap: 10px; }
        #msg-input { flex: 1; padding: 10px; font-size: 16px; }

        /* --- 任務系統 --- */
        #task-container { padding: 40px; max-width: 800px; margin: 0 auto; width: 100%; }
        
        /* 任務列表樣式 */
        #task-list-ul { list-style: none; padding: 0; }
        .task-card {
            background: white; border: 1px solid #eee; padding: 15px; margin-bottom: 15px;
            border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative;
        }
        .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .task-title { font-size: 18px; font-weight: bold; color: #2c3e50; }
        .task-meta { font-size: 12px; color: #7f8c8d; margin-bottom: 8px; }
        .task-desc { color: #555; white-space: pre-wrap; margin-bottom: 10px; }
        .add-btn {
            position: absolute;  /* 絕對定位：讓它脫離原本的容器 */
            top: 20px;           /* 距離上方 20px */
            right: 30px;         /* 距離右方 30px */
            
            /* 以下是原本的外觀設定，保留即可 */
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            z-index: 10; /* 確保它浮在最上層 */
        }
        .delete-btn { background-color: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

        /* --- 彈出視窗 (Modal) CSS --- */
        .modal {
            display: none; /* 預設隱藏 */
            position: fixed; 
            z-index: 1000; 
            left: 0; top: 0; 
            width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.5); /* 半透明黑底 */
            justify-content: center; align-items: center;
        }
        .modal-content {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            width: 400px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
        }
        .modal h3 { margin-top: 0; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 8px; box-sizing: border-box; 
            border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
        }
        .modal-actions { text-align: right; margin-top: 20px; }
        .btn-cancel { background: #95a5a6; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-right: 10px; }
        .btn-save { background: #2ecc71; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        /* 已完成任務的樣式：刪除線 + 變淡 */
        .task-completed .task-title {
            text-decoration: line-through;
            color: #95a5a6;
        }
        /* 完成按鈕的樣式 */
        .btn-check {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
        }
        .btn-check:hover { background-color: #27ae60; }

        /* 如果任務已完成，按鈕改個顏色 (例如灰色) */
        .task-completed .btn-check {
            background-color: #bdc3c7;
        }
        /* 編輯按鈕樣式 */
        .btn-edit-task {
            background-color: #f39c12; /* 橘色 */
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
        }
        .btn-edit-task:hover { background-color: #e67e22; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="user-info">
            <span id="username-display">載入中...</span>
            <button class="btn-edit" onclick="changeName()">修改暱稱</button>
        </div>
        <button class="nav-btn active" onclick="switchTab('chat')">💬 聊天室</button>
        <button class="nav-btn" onclick="switchTab('task')">📋 我的任務</button>
        <button class="nav-btn" onclick="switchTab('bounty')">💰 懸賞任務</button>
    </div>

    <div id="main-content">
        <div id="section-chat" class="page-section active">
            <ul id="chat-list"></ul>
            <div id="input-area">
                <select id="recipient"><option value="all">所有人</option></select>
                <input id="msg-input" placeholder="輸入訊息...">
                <button onclick="send()" style="padding:10px; background:#1abc9c; color:white; border:none; border-radius:4px; cursor:pointer;">送出</button>
            </div>
        </div>

        <div id="section-task" class="page-section">
            <div id="task-container">
                <div style="text-align: right; margin-bottom: 10px;">
                    <button class="add-btn" onclick="openModal()">+ 新增任務</button>
                </div>
                <ul id="task-list-ul"></ul>
            </div>
        </div>

        <div id="section-bounty" class="page-section">
            <div id="task-container">
                <div style="text-align: right; margin-bottom: 10px;">
                    <button class="add-btn" onclick="openBountyModal()">+ 發布懸賞</button>
                </div>
                <ul id="bounty-list-ul"></ul>
            </div>
        </div>
    </div>

    <div id="taskModal" class="modal">
        <div class="modal-content">
            <h3>新增待辦事項</h3>
            
            <div class="form-group">
                <label>標題</label>
                <input type="text" id="m-title" placeholder="例如：完成報告">
            </div>
            
            <div class="form-group">
                <label>細節說明</label>
                <textarea id="m-desc" rows="3" placeholder="輸入更多細節..."></textarea>
            </div>
            
            <div class="form-group">
                <label>最後期限</label>
                <input type="datetime-local" id="m-deadline">
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-save" onclick="submitTask()">儲存</button>
            </div>
        </div>
    </div>

    <div id="bountyModal" class="modal">
        <div class="modal-content">
            <h3>發布懸賞任務</h3>
            
            <div class="form-group">
                <label>標題</label>
                <input type="text" id="b-title" placeholder="例如：完成報告">
            </div>
            
            <div class="form-group">
                <label>細節說明</label>
                <textarea id="b-desc" rows="3" placeholder="輸入更多細節..."></textarea>
            </div>
            
            <div class="form-group">
                <label>懸賞金額</label>
                <input type="number" id="b-reward">
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeBountyModal()">取消</button>
                <button class="btn-save" onclick="submitBounty()">儲存</button>
            </div>
        </div>
    </div>

<script>
    const input = document.getElementById("msg-input");
    // --- 共用與切換 ---
    function switchTab(tab) {
        document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`section-${tab}`).classList.add('active');
        const btnMap = {chat : 0, task : 1, bounty : 2}
        document.querySelectorAll('.nav-btn')[btnMap[tab]].classList.add('active');
        
        if(tab == 'task')  loadTasks();
        if(tab == 'bounty')  loadBounties();
    }

    // --- 聊天室 ---
    let ws = null;
    fetch("/refresh", { method: "POST" }).then(res=>res.json()).then(data => {
        ws = new WebSocket(`ws://${window.location.host}/ws/chat?token=${data.access_token}`);
        ws.onmessage = (e) => {
            let li = document.createElement("li"); li.innerText = e.data;
            document.getElementById("chat-list").appendChild(li);
            document.getElementById("chat-list").scrollTop = document.getElementById("chat-list").scrollHeight;
        };
    });
    function send(){
        let input = document.getElementById("msg-input");
        if(ws && input.value.trim()) {
            ws.send(JSON.stringify({to: document.getElementById("recipient").value, message: input.value}));
            input.value = "";
        }
    }
    
    // 初始化讀取
    fetch("/user/username").then(r=>r.json()).then(d=>document.getElementById("username-display").innerText = d.name);
    function changeName(){ 
        let n=prompt("新暱稱:"); 
        if(n) fetch("/user/username",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n})}).then(()=>location.reload()); 
    }

    // ==========================================
    // --- 任務系統 (Modal 版本) ---
    // ==========================================
    // 定義 loadName 函式
    let allTasks = [];       // 用來暫存所有任務資料
    let editingTaskId = null; // 用來記錄現在正在編輯哪一個任務 (null 代表是新增模式)
    let editingBountyId = null;
    function loadName(){
        fetch("/user/username")
        .then(res => res.json())
        .then(data => {
            // 更新網頁左上角的顯示
            document.getElementById("username-display").innerText = data.name;
        })
        .catch(err => console.error("無法讀取暱稱", err));
    }
    // 1. 開啟視窗
    function openModal(isEditMode = false) {
        const modal = document.getElementById('taskModal');
        const titleLabel = document.querySelector('#taskModal h3');

        modal.style.display = 'flex';

        if (!isEditMode) {
            // --- 新增模式 ---
            editingTaskId = null; // 清空編輯 ID
            titleLabel.innerText = "新增待辦事項";
            // 清空輸入框
            document.getElementById('m-title').value = "";
            document.getElementById('m-desc').value = "";
            document.getElementById('m-deadline').value = "";
        }
    }

    function editTask(id) {
        // 從暫存的陣列中找到這筆任務
        const task = allTasks.find(t => t.id === id);
        if (!task) return;

        // 設定為編輯模式
        editingTaskId = id;
        document.querySelector('#taskModal h3').innerText = "編輯待辦事項";

        // 把舊資料填進去
        document.getElementById('m-title').value = task.title;
        document.getElementById('m-desc').value = task.description || "";
        document.getElementById('m-deadline').value = task.deadline || "";

        // 開啟視窗 (傳入 true 代表是編輯模式)
        openModal(true);
    }
    // 2. 關閉視窗
    function closeModal() {
        document.getElementById('taskModal').style.display = 'none';
        editingTaskId = null; // 關閉時重置狀態
    }

    // 3. 送出資料 (呼叫後端)
    async function submitTask() {
        const title = document.getElementById('m-title').value.trim();
        const desc = document.getElementById('m-desc').value.trim();
        const deadline = document.getElementById('m-deadline').value;

        if(!title) return alert("請至少輸入標題");

        const taskData = {
            title: title,
            description: desc,
            deadline: deadline,
            is_completed: false 
        };

        try {
            let url = '/tasks/';
            let method = 'POST';

            // 如果 editingTaskId 有值，代表現在是「編輯模式」
            if (editingTaskId) {
                url = `/tasks/${editingTaskId}`; // 改成呼叫 PUT /tasks/{id}
                method = 'PUT';
            }

            const res = await fetch(url, {
                method: method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(taskData)
            });

            if(res.ok) {
                closeModal();
                loadTasks(); // 重新載入列表
            } else {
                alert("操作失敗");
            }
        } catch (error) {
            console.error("Error:", error);
            alert("連線錯誤");
        }
    }

    // 4. 載入任務列表 (顯示標題、時間、細節)
    async function loadTasks() {
        try {
            const res = await fetch('/tasks/');
            if (!res.ok) return;

            // 存到全域變數，讓 editTask 可以查
            allTasks = await res.json(); 
            
            const list = document.getElementById('task-list-ul');
            list.innerHTML = '';

            allTasks.forEach(task => {
                const li = document.createElement('li');
                li.className = 'task-card';
                if (task.is_completed) li.classList.add('task-completed');

                let timeHtml = '';
                if(task.deadline) {
                    const dateObj = new Date(task.deadline);
                    timeHtml = `<span style="color:#e67e22; font-weight:bold;">🕒 到期日：${dateObj.toLocaleString()}</span>`;
                }

                const btnText = task.is_completed ? "↩️ 復原" : "✅ 完成";

                li.innerHTML = `
                    <div class="task-header">
                        <span class="task-title">${task.title}</span>
                        <div>
                            <button class="btn-edit-task" onclick="editTask(${task.id})">✏️ 編輯</button>
                            
                            <button class="btn-check" onclick="toggleTask(${task.id})">${btnText}</button>
                            <button class="delete-btn" onclick="deleteTask(${task.id})">刪除</button>
                        </div>
                    </div>
                    <div class="task-meta">${timeHtml}</div>
                    <div class="task-desc">${task.description || '(無詳細說明)'}</div>
                `;
                list.appendChild(li);
            });
        } catch (error) {
            console.error("loadTasks error:", error);
        }
    }

    async function toggleTask(taskId) {
        try {
            // 呼叫後端 PUT API
            const res = await fetch(`/tasks/${taskId}/toggle`, { method: 'PUT' });
            if (res.ok) {
                // 成功後重新載入，因為後端有設定排序，
                // 所以已完成的任務會自動跑到最下面
                loadTasks(); 
            } else {
                alert("更新失敗");
            }
        } catch (e) {
            console.error(e);
            alert("連線錯誤");
        }
    }
    
    async function deleteTask(id) {
        if(confirm("確定刪除?")) {
            await fetch(`/tasks/${id}`, {method:'DELETE'});
            loadTasks();
        }
    }
    input.addEventListener("keydown", function(e){
        if(e.key === "Enter" && !e.shiftKey){
            e.preventDefault();
            send();
        }
    });
    // ==========================================
    // --- 補回：讀取歷史聊天紀錄 ---
    // ==========================================
    
    async function loadChatHistory() {
        try {
            // 呼叫後端 API 拿取最近 50 筆資料
            const res = await fetch("/messages");
            const messages = await res.json();
            
            const list = document.getElementById("chat-list");
            list.innerHTML = ""; // 先清空，避免重複顯示

            messages.forEach(msg => {
                const li = document.createElement("li");
                // 格式： 名字: 內容
                li.innerText = `${msg.name}: ${msg.content}`;
                list.appendChild(li);
            });

            // 讀取完後，自動捲動到最底部（看最新訊息）
            list.scrollTop = list.scrollHeight;
            
        } catch (error) {
            console.error("讀取歷史訊息失敗:", error);
        }
    }

    // ==========================================
    // --- 懸賞系統 (Modal 版本) ---
    // ==========================================
    // 載入懸賞
    async function loadBounties() {
        try{
            const res = await fetch("/bounty/open")
            if(!res.ok) return;

            const bounties = await res.json();
            const ul = document.getElementById("bounty-list-ul")
            ul.innerHTML = "";

            bounties.forEach(bou => {
                const li = document.createElement("li")
                li.className = "task-card";

                li.innerHTML = `
                    <div class="task-header">
                        <span class="task-title">${bou.title}</span>
                        <span style="color:#e74c3c;">💰 ${bou.reward}</span>
                    </div>
                    
                    <div class="task-meta">發布者 : ${bou.owner_name}</div>
                    <div class="task-desc">${bou.description || '(無詳細說明)'}</div>
                    <button class="btn-check" onclick="takeBounty(${bou.id})">接取任務</button>
                `;
                ul.appendChild(li);
            })
        }catch(err){
                console.error(err);
        }
    }

    // 接取任務
    async function takeBounty(id) {
        if(!confirm("確定要接取這個懸賞任務?"))  return;

        const res = await fetch(`bounty/${id}/take`, { method : "POST" });
        if(res.ok){
            alert("成功接取任務");
            loadBounties();
        }else{
            alert("接取失敗")
        }
    }

    // 1. 開啟視窗
    function openBountyModal(isEditMode = false) {
        const modal = document.getElementById('bountyModal');
        const titleLabel = document.querySelector('#bountyModal h3');

        modal.style.display = 'flex';

        if (!isEditMode) {
            // --- 新增模式 ---
            editingBountyId = null; // 清空編輯 ID
            titleLabel.innerText = "發布懸賞任務";
            // 清空輸入框
            document.getElementById('b-title').value = "";
            document.getElementById('b-desc').value = "";
            document.getElementById('b-reward').value = "";
        }
    }
    
    function closeBountyModal(){
        document.getElementById("bountyModal").style.display = "none";
    }

    async function submitBounty(){
        const title = document.getElementById('b-title').value.trim();
        const desc  = document.getElementById('b-desc').value.trim();
        const rewardVal = document.getElementById('b-reward').value;

        const reward = parseInt(rewardVal);

        if (!title) {
            alert("請輸入標題");
            return;
        }

        if (isNaN(reward) || reward <= 0) {
            alert("請輸入正確的懸賞金額");
            return;
        }

        const data = {
            title: title,
            description: desc,
            reward: reward
        };
        const res = await fetch("/bounty/", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(data)
        });
        if(res.ok){
            closeBountyModal();
            loadBounties();
        }else{
            const t = await res.text();
            console.error("發布失敗:", t);
            alert("發布失敗");
        }
    }

    loadName();        // 載入使用者暱稱
    loadChatHistory();
    loadTasks();       // 載入任務清單
</script>
</body>
</html>
